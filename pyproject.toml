[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "contextroast"
version = "0.2.2"
description = "Test which LLM context fields actually matter. Catch regressions and estimate savings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "context", "evaluation", "tokens", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["typer>=0.12,<1", "PyYAML>=6.0.2,<7"]

[project.urls]
Repository = "https://github.com/newapple77/ContextRoast"
Issues = "https://github.com/newapple77/ContextRoast/issues"
Changelog = "https://github.com/newapple77/ContextRoast/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
contextroast = "contextroast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contextroast"]
# Keep release artifacts compatible with validators that do not yet accept metadata 2.5.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/examples", "/docs", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/.gitignore", "/assets", "/SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
