name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version without v (must match package version)
        required: true

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check version, release identity and successful CI
        id: check
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          version = os.environ['RELEASE_VERSION']
          repo = os.environ['GH_REPO']
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'contextroast' and version == project['version'], 'Version mismatch'
          assert Path(f'docs/releases/v{version}.md').is_file(), 'Release notes missing'
          for resource in (f'releases/tags/v{version}', f'git/ref/tags/v{version}'):
              result = subprocess.run(
                  ['gh', 'api', f'repos/{repo}/{resource}'], capture_output=True, text=True,
              )
              if result.returncode == 0:
                  sys.exit(f'v{version} already exists. Choose a new version.')
              if '(HTTP 404)' not in result.stderr:
                  sys.exit('Cannot verify release/tag availability; refusing to continue.')
          sha, branch = os.environ['RELEASE_COMMIT'], os.environ['RELEASE_BRANCH']
          endpoint = f'repos/{repo}/actions/workflows/ci.yml/runs?head_sha={sha}&branch={branch}&event=push&status=success&per_page=1'
          runs = json.loads(subprocess.check_output(['gh', 'api', endpoint]))['workflow_runs']
          if not runs or runs[0]['head_sha'] != sha or runs[0]['conclusion'] != 'success':
              sys.exit('This commit needs successful default-branch CI before release.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={runs[0]['id']}\n")
          PY
      - name: Download the packages verified by CI
        env:
          CI_RUN: ${{ steps.check.outputs.run_id }}
        run: |
          gh run download "$CI_RUN" --repo "$GH_REPO" --name contextroast-packages --dir dist
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          expected = {f'contextroast-{version}.tar.gz', f'contextroast-{version}-py3-none-any.whl'}
          assert {p.name for p in Path('dist').iterdir()} == expected, 'Unexpected CI packages'
          PY
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Create prerelease draft
        run: |
          gh release create "v$RELEASE_VERSION" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --draft --prerelease --target "$RELEASE_COMMIT" \
            --title "ContextRoast v$RELEASE_VERSION alpha" \
            --notes-file "docs/releases/v$RELEASE_VERSION.md"
