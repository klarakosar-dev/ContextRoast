name: Sync published alpha notes

on:
  push:
    branches: [main]
    paths:
      - docs/releases/v0.2.2.md

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Update published v0.2.2 release links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v0.2.2 --notes-file docs/releases/v0.2.2.md
